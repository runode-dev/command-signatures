# 每周装一次清单里各命令的最新版，拿它们的 --help 核对 command-signatures/json 里的规格。
# 一个命令对不上时开一个 issue 列出差异，已经开着的就改它的标题和正文；对得上时关掉开着的
# 那个。pi.json 是这个 fork 自己加的，差异直接在这里改；claude、codex 的规格是上游维护的，
# 差异给上游 warpdotdev/command-signatures 提 PR，免得每周合并上游时冲突。
# 加命令：在 matrix 里加一项，先在本地跑一遍脚本，看它的帮助能不能读对。
name: 核对命令规格

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 几个 job 同时查找、开 issue 时互不相干：每个只认自己命令名开头的标题。
      matrix:
        include:
          - command: pi
            package: '@earendil-works/pi-coding-agent'
          - command: claude
            package: '@anthropic-ai/claude-code'
          - command: codex
            package: '@openai/codex'
    env:
      GH_TOKEN: ${{ github.token }}
      COMMAND: ${{ matrix.command }}
      TITLE_PREFIX: 命令补全和 ${{ matrix.command }}
      # 只看帮助，不让它们启动时联网或自己更新。
      PI_OFFLINE: '1'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 装最新版
        run: npm install --global "${{ matrix.package }}@latest"
      - name: 核对，开或关 issue
        run: |
          version=$("$COMMAND" --version | head -n 1)
          existing=$(gh issue list --state open --json number,title \
            --jq "[.[] | select(.title | startswith(\"$TITLE_PREFIX \"))][0].number // empty")
          spec="command-signatures/json/$COMMAND.json"
          if python3 script/check-command-spec.py "$spec" "$COMMAND" > "$RUNNER_TEMP/report.md"; then
            echo "$COMMAND $version 和规格对得上。"
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "$COMMAND $version 的帮助和规格已经对得上了。"
            fi
            exit 0
          fi
          # 脚本自己出错时没有输出，当失败处理，不开 issue。
          [ -s "$RUNNER_TEMP/report.md" ] || exit 1
          title="$TITLE_PREFIX $version 的帮助对不上"
          {
            echo "最新的 $COMMAND（\`$version\`）的 \`--help\` 和 \`$spec\` 有这些差异："
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "本地核对：\`python3 script/check-command-spec.py $spec $COMMAND\`。fork 自己加的规格改好推到 main，runode 那边每周的「更新命令规格」会挪子模块指针；上游维护的规格给 warpdotdev/command-signatures 提 PR。"
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
