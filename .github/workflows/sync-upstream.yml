# 每周把上游 warpdotdev/command-signatures 的 main 合进这个 fork 的 main，
# 我们自己补的改动留在合并之上。合并有冲突时运行失败，需要手动解决后再推。
name: 同步上游

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 合并上游
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/warpdotdev/command-signatures.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已经包含上游最新的提交，不用合并。"
            exit 0
          fi
          if ! git merge --no-edit -m "合并上游 warpdotdev/command-signatures" upstream/main; then
            git merge --abort
            echo "::error::和上游合并有冲突，需要手动合并后推送。"
            exit 1
          fi
          # 上游改了 .github/workflows 下的文件时，GITHUB_TOKEN 没有权限推送，这里会失败，
          # 同样需要手动推送。
          git push origin main
