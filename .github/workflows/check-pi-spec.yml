# 每周装一次最新的 pi，拿它的 --help 核对 pi.json。对不上时开一个 issue 列出差异，已经
# 开着的就改它的标题和正文；对得上时关掉开着的那个。pi.json 是这个 fork 自己加的，上游
# 不管它，只能靠这里发现 pi 加了或去掉了选项。
name: 核对 pi 的命令规格

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pi:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE_PREFIX: 命令补全和 pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 装最新的 pi
        run: npm install --global @earendil-works/pi-coding-agent@latest
      - name: 核对，开或关 issue
        env:
          # 只看帮助，不让 pi 启动时联网。
          PI_OFFLINE: '1'
        run: |
          version=$(pi --version)
          existing=$(gh issue list --state open --json number,title \
            --jq "[.[] | select(.title | startswith(\"$TITLE_PREFIX \"))][0].number // empty")
          spec=command-signatures/json/pi.json
          if python3 script/check-command-spec.py "$spec" pi > "$RUNNER_TEMP/report.md"; then
            echo "pi $version 和规格对得上。"
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "pi $version 的帮助和规格已经对得上了。"
            fi
            exit 0
          fi
          # 脚本自己出错时没有输出，当失败处理，不开 issue。
          [ -s "$RUNNER_TEMP/report.md" ] || exit 1
          title="$TITLE_PREFIX $version 的帮助对不上"
          {
            echo "最新的 pi $version 的 \`--help\` 和 \`command-signatures/json/pi.json\` 有这些差异："
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "改好 \`pi.json\` 推到 main，runode 那边每周的「更新命令规格」会挪子模块指针。本地核对：\`python3 script/check-command-spec.py command-signatures/json/pi.json pi\`。"
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
